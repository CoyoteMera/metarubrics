<!-- `no-file` until app.js loads a file: hides every bar — title, menus,
     heading, status — leaving only the centred splash. Set here too so the
     chrome never flashes on first paint. -->
<body class="no-file">

  <!-- TOP BAR -->
  <header id="top-bar">
    <input id="file-info" value="Sin archivo" spellcheck="false" autocomplete="off"
           aria-label="Nombre del archivo — editable" title="Clic para renombrar" disabled>
    <span id="dirty-flag" hidden title="Hay cambios sin guardar">● sin guardar</span>

    <div id="logo">
      <span id="logo-home">
        <span class="brand-wordmark">Metarubrics</span>
      </span>
    </div>
  </header>

  <!-- MENU BAR — the only toolbar, desktop-style text menus -->
  <div id="table-toolbar">
    <nav id="menu-bar">
      <button class="menu-trigger" id="btn-open">Abrir</button>
      <input type="file" id="file-input" accept=".ale,.csv,.tsv,.txt,.xlsx,.xls,.cdl,.ccc,.cc,.edl" multiple hidden>

      <div class="dropdown">
        <button class="menu-trigger dropdown-trigger" aria-haspopup="true" aria-expanded="false">Guardar</button>
        <div class="dropdown-menu" hidden>
          <button class="dropdown-item" id="btn-save" disabled>ALE</button>
          <button class="dropdown-item" id="btn-export-csv" disabled>CSV</button>
          <button class="dropdown-item" id="btn-export-xlsx" disabled>XLSX</button>

  <!-- HEADING PANEL -->

  <!-- STATUS BAR -->
  <div id="status-bar">
    <span id="status-text"></span>
    <div id="zoom-control" class="is-disabled">
      <button type="button" id="zoom-out" aria-label="Alejar" title="Alejar">&#8722;</button>
      <span id="zoom-value" role="button" tabindex="0" title="Restablecer zoom">100%</span>

    </div>

  <!-- FIND & REPLACE PANEL -->
  <div id="fnr-panel" hidden>
    <div id="fnr-row">

      <button class="btn btn-secondary btn-sm" id="fnr-prev"    title="Anterior (Shift+Enter)">↑</button>
      <button class="btn btn-secondary btn-sm" id="fnr-next"    title="Siguiente (Enter)">↓</button>
      <button class="btn btn-secondary btn-sm" id="fnr-replace-one" title="Reemplazar este">Reemplazar</button>
      <button class="btn btn-utility  btn-sm" id="fnr-replace-all" title="Reemplazar todos">Reemplazar todo</button>
      <button class="btn btn-secondary btn-sm" id="fnr-close"   title="Cerrar (Escape)">✕</button>
    </div>
  </div>

      <button class="btn btn-secondary btn-sm" id="btn-empty-hide">Ocultar</button>

      <button class="btn btn-utility btn-sm" id="btn-empty-show">Mostrar</button>
      <button class="btn btn-secondary btn-sm" id="btn-empty-cancel">Cancelar</button>
