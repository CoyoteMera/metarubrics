<!-- `no-file` until app.js loads a file: hides every bar — title, menus,
     heading, status — leaving only the centred splash. Set here too so the
     chrome never flashes on first paint. -->
<body class="no-file">

  <!-- TOP BAR -->
  <header id="top-bar">
    <input id="file-info" value="Sin archivo" spellcheck="false" autocomplete="off"
           aria-label="Nombre del archivo — editable" title="Clic para renombrar" disabled>
    <span id="dirty-flag" hidden title="Hay cambios sin guardar">● sin guardar</span>

    <div id="logo">
      <span id="logo-home">
        <span class="brand-wordmark">Metarubrics</span>
      </span>
    </div>
  </header>

  <!-- MENU BAR — the only toolbar, desktop-style text menus -->
  <div id="table-toolbar">
    <nav id="menu-bar">
      <button class="menu-trigger" id="btn-open">Abrir</button>
      <input type="file" id="file-input" accept=".ale,.csv,.tsv,.txt,.xlsx,.xls,.cdl,.ccc,.cc,.edl" multiple hidden>

      <div class="dropdown">
        <button class="menu-trigger dropdown-trigger" aria-haspopup="true" aria-expanded="false">Guardar</button>
        <div class="dropdown-menu" hidden>
          <button class="dropdown-item" id="btn-save" disabled>ALE</button>
